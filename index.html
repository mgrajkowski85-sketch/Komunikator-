<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><title>Komunikator</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:18px 16px;font-size:22px;font-weight:700}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #0001}.row{display:flex;gap:10px;align-items:center}.avatar{width:46px;height:46px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}input,button{font:inherit;border-radius:12px;padding:11px;border:1px solid #d1d5db}input{width:100%}button{background:#2563eb;color:#fff;border:0;font-weight:600;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.chat{height:55vh;overflow:auto;padding:8px;background:#f9fafb;border-radius:14px}.msg{max-width:78%;padding:10px 13px;margin:7px 0;border-radius:16px;background:#e5e7eb}.me{margin-left:auto;background:#2563eb;color:#fff}.small{font-size:12px;color:#6b7280}.hidden{display:none}.contact{padding:12px;border-radius:12px}.contact:hover{background:#f3f4f6}.file{font-size:13px;margin-top:7px}.file img{max-width:220px;max-height:220px;border-radius:10px;display:block;margin-top:5px}</style></head><body><header>💬 Komunikator</header><main class="wrap"><section id="login" class="card"><h2>Twoje konto</h2><p class="small">Konto działa na serwerze, więc możesz korzystać z komunikatora na różnych telefonach.</p><input id="name" placeholder="Nick (np. Mariusz)" autocomplete="username"><br><br><input id="password" type="password" placeholder="Hasło" autocomplete="current-password"><br><br><button onclick="start()">Wejdź do komunikatora</button><p id="loginInfo" class="small"></p></section><section id="app" class="hidden"><div class="card"><div class="row"><div class="avatar" id="myAvatar">?</div><div><b id="myName"></b><div class="small">Twój profil</div></div><button class="secondary" style="margin-left:auto" onclick="logout()">Wyloguj</button></div></div><div class="card"><h3>👥 Kontakty</h3><div class="row"><input id="newContact" placeholder="Nick znajomego"><button onclick="addContact()">Dodaj</button></div><div id="contacts"></div></div><div id="chatBox" class="card hidden"><div class="row"><div class="avatar" id="chatAvatar">?</div><div><b id="chatName"></b><div class="small">Rozmowa</div></div></div><br><div class="chat" id="messages"></div><br><div class="row"><input id="message" placeholder="Napisz wiadomość..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Wyślij</button></div><br><div class="row"><input id="file" type="file" accept="image/*,.pdf,.doc,.docx,.txt"><button onclick="sendFile()">📎</button></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://ztewmlwwdnfhgepxtzuc.supabase.co";
const SUPABASE_KEY="sb_publishable_-HmwyuQS3yxBNfPAfuvMnQ_jy1SOFn2";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const EMAIL_DOMAIN="@komunikator.app";
let me=localStorage.getItem("kom_me")||"",contacts=JSON.parse(localStorage.getItem("kom_contacts")||"[]"),active="",activeConversation=null;
function emailFor(n){return n.toLowerCase()+EMAIL_DOMAIN}
function save(){localStorage.setItem("kom_me",me);localStorage.setItem("kom_contacts",JSON.stringify(contacts))}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function start(){
 const n=document.getElementById("name").value.trim(),pass=document.getElementById("password").value;
 if(!/^[a-zA-Z0-9_.-]{3,30}$/.test(n))return alert("Nick musi mieć 3-30 znaków: litery, cyfry, . _ -");
 if(pass.length<6)return alert("Hasło musi mieć co najmniej 6 znaków.");
 const email=emailFor(n);
 let r=await db.auth.signInWithPassword({email,password:pass});
 if(r.error){
   r=await db.auth.signUp({email,password:pass});
   if(r.error)return alert("Nie udało się zalogować/utworzyć konta: "+r.error.message);
   if(!r.data.session)return alert("Konto utworzone, ale Supabase wymaga potwierdzenia e-mail. W ustawieniach Auth trzeba wyłączyć potwierdzanie e-maili dla tego komunikatora.");
 }
 if(r.data.user){
   const p=await db.from("profiles").upsert({id:r.data.user.id,username:n.toLowerCase(),display_name:n});
   if(p.error)return alert("Błąd profilu: "+p.error.message);
 }
 me=n;save();await render();
}
async function logout(){await db.auth.signOut();me="";active="";activeConversation=null;localStorage.removeItem("kom_me");await render()}
async function addContact(){const n=document.getElementById("newContact").value.trim().toLowerCase();if(!n||n===me.toLowerCase())return;const r=await db.from("profiles").select("id,username,display_name").eq("username",n).maybeSingle();if(r.error||!r.data)return alert("Nie znaleziono takiego użytkownika.");const u=(await db.auth.getUser()).data.user;if(!u)return;let existing=null;const cm=await db.from("conversation_members").select("conversation_id").eq("user_id",u.id);for(const x of(cm.data||[])){const mm=await db.from("conversation_members").select("user_id").eq("conversation_id",x.conversation_id);if((mm.data||[]).some(z=>z.user_id===r.data.id)){existing=x.conversation_id;break}}let cid=existing;if(!cid){const c=await db.from("conversations").insert({kind:"direct"}).select("id").single();if(c.error)return alert(c.error.message);const m=await db.from("conversation_members").insert([{conversation_id:c.data.id,user_id:u.id},{conversation_id:c.data.id,user_id:r.data.id}]);if(m.error)return alert(m.error.message);cid=c.data.id}if(!contacts.includes(r.data.display_name))contacts.push(r.data.display_name);save();document.getElementById("newContact").value="";await render()}
async function openChat(n){active=n;const u=(await db.auth.getUser()).data.user;if(!u)return;const p=await db.from("profiles").select("id").eq("display_name",n).maybeSingle();if(!p.data)return;const cm=await db.from("conversation_members").select("conversation_id").eq("user_id",u.id);activeConversation=null;for(const x of(cm.data||[])){const mm=await db.from("conversation_members").select("user_id").eq("conversation_id",x.conversation_id);if((mm.data||[]).some(z=>z.user_id===p.data.id)){activeConversation=x.conversation_id;break}}document.getElementById("chatBox").classList.remove("hidden");document.getElementById("chatName").textContent=n;document.getElementById("chatAvatar").textContent=n[0].toUpperCase();await renderMessages()}
async function send(){const i=document.getElementById("message"),t=i.value.trim();if(!t||!activeConversation)return;const u=(await db.auth.getUser()).data.user;if(!u)return;const r=await db.from("messages").insert({conversation_id:activeConversation,sender_id:u.id,body:t});if(r.error)return alert(r.error.message);i.value="";await renderMessages()}
async function sendFile(){const input=document.getElementById("file"),file=input.files[0];if(!file||!activeConversation)return;if(file.size>15*1024*1024)return alert("Maksymalny rozmiar pliku to 15 MB.");const u=(await db.auth.getUser()).data.user;if(!u)return;const path=u.id+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await db.storage.from("chat-files").upload(path,file);if(up.error)return alert(up.error.message);const r=await db.from("messages").insert({conversation_id:activeConversation,sender_id:u.id,attachment_path:path,attachment_name:file.name,attachment_type:file.type,attachment_size:file.size});if(r.error)return alert(r.error.message);input.value="";await renderMessages()}
async function renderMessages(){const el=document.getElementById("messages");if(!activeConversation){el.innerHTML="";return}const u=(await db.auth.getUser()).data.user;if(!u)return;const r=await db.from("messages").select("id,body,attachment_path,attachment_name,attachment_type,created_at,sender_id").eq("conversation_id",activeConversation).is("deleted_at",null).order("created_at");if(r.error)return;let out="";for(const m of(r.data||[])){let a="";if(m.attachment_path){const s=await db.storage.from("chat-files").createSignedUrl(m.attachment_path,3600);if(!s.error&&s.data?.signedUrl){if((m.attachment_type||"").startsWith("image/"))a='<div class="file"><a href="'+s.data.signedUrl+'" target="_blank"><img src="'+s.data.signedUrl+'" alt=""></a></div>';else a='<div class="file">📎 <a href="'+s.data.signedUrl+'" target="_blank" rel="noopener">'+escapeHtml(m.attachment_name||"plik")+"</a></div>"}else a='<div class="file">📎 '+escapeHtml(m.attachment_name||"plik")+"</div>"}out+='<div class="msg '+(m.sender_id===u.id?"me":"")+'">'+escapeHtml(m.body||"")+a+'<div class="small">'+new Date(m.created_at).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"})+"</div></div>"}el.innerHTML=out;el.scrollTop=el.scrollHeight}
async function render(){const u=(await db.auth.getUser()).data.user,logged=!!u&&!!me;document.getElementById("login").classList.toggle("hidden",logged);document.getElementById("app").classList.toggle("hidden",!logged);if(!logged)return;document.getElementById("myName").textContent=me;document.getElementById("myAvatar").textContent=me[0].toUpperCase();document.getElementById("contacts").innerHTML=contacts.map(n=>'<div class="contact row" onclick="openChat('+JSON.stringify(n)+')"><div class="avatar">'+escapeHtml(n[0].toUpperCase())+'</div><div><b>'+escapeHtml(n)+'</b><div class="small">Otwórz rozmowę</div></div></div>').join("")||'<p class="small">Dodaj pierwszy kontakt.</p>';if(active)await openChat(active)}
db.auth.onAuthStateChange((_e,s)=>{if(s&&!me)return});
db.channel("messages-live").on("postgres_changes",{event:"*",schema:"public",table:"messages"},async()=>{if(activeConversation)await renderMessages()}).subscribe();
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
